name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Detect Cargo project
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet - skipping cargo steps (bootstrap scaffolding)."
          fi

      - name: Show toolchain
        if: steps.detect.outputs.cargo == 'true'
        run: |
          rustc --version
          cargo --version

      - name: Build
        if: steps.detect.outputs.cargo == 'true'
        run: cargo build --all-targets --verbose

      - name: Test
        if: steps.detect.outputs.cargo == 'true'
        run: cargo test --verbose

  msrv:
    # The `rust-version` in Cargo.toml is a promise to consumers, and the jobs
    # above cannot keep it: they build on whatever the runners currently ship,
    # so a post-floor API would pass every gate and leave the declaration
    # quietly false. This job is the only thing that makes it a contract.
    #
    # Exactly what this job proves, and nothing beyond it: on Ubuntu, the
    # non-test lib and bin source of crap4rust compiles with rustc at the
    # declared floor, against a lockfile generated for that floor.
    #
    # What it deliberately does not prove:
    #   * test-only code — `cargo build` compiles neither `#[cfg(test)]` items
    #     nor the `tests/` targets, so a post-floor API used only in tests
    #     passes this job;
    #   * other platforms — one ubuntu-latest runner, so `#[cfg(windows)]` and
    #     any other inactive-cfg source is never compiled at the floor;
    #   * that a consumer's own cargo can resolve the floor (see below).
    #
    # The claim is scoped to *our source*, not to the committed Cargo.lock:
    # that lock is the developer/CI lock and needs a newer cargo (edition-2024
    # dependency manifests). So this job deliberately does not use it; it
    # regenerates one in the runner's throwaway checkout.
    #
    # Steering matters, and it is not what a floor-only consumer has: cargo at
    # the floor predates the rust-version-aware resolver, so left alone it
    # re-resolves to the newest dependencies and fails for a reason that has
    # nothing to do with our source. The resolving here is done by the
    # runner's *current stable* cargo with the MSRV-aware resolver switched
    # on, picking versions from `rust-version` in Cargo.toml — the same field
    # this job reads, so there is nothing to keep in sync and no
    # per-dependency pin to go stale. A consumer must do the same: generate
    # the lock with a newer MSRV-aware cargo, then build it with the floor
    # toolchain. Regenerating with an unaided cargo at the floor does not
    # work, and this job does not claim it does.
    #
    # Failure is loud by construction: if the steering ever stops working the
    # generated lock holds dependencies above the floor and the `--locked`
    # build at the floor fails, exactly as it does with no steering at all.
    #
    # Deliberately `cargo build` on one runner: the floor is about which
    # compiler can build the shipped crate, not about test or platform
    # coverage, which the matrix above already gives.
    name: MSRV (build on the declared floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Read the declared floor
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::No rust-version in Cargo.toml"; exit 1; }
          echo "Declared rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain
        run: |
          version='${{ steps.msrv.outputs.version }}'
          rustup toolchain install "$version" --profile minimal
          # Prove the build below really runs on the floor, not on whatever
          # rustup would otherwise resolve to.
          actual=$(rustc "+$version" --version)
          echo "$actual"
          echo "$actual" | grep -qE "^rustc ${version//./\\.}([. ])" \
            || { echo "::error::Toolchain '$version' reports as: $actual"; exit 1; }

      - name: Resolve dependencies for the floor
        run: |
          # Throwaway lock, runner checkout only - the committed Cargo.lock is
          # never regenerated by this job in the repository.
          rm -f Cargo.lock
          test ! -f Cargo.lock || { echo "::error::Cargo.lock survived removal"; exit 1; }
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo generate-lockfile --verbose

      - name: Build on the floor
        run: cargo "+${{ steps.msrv.outputs.version }}" build --locked --verbose

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Detect Cargo project
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet - skipping lint (bootstrap scaffolding)."
          fi

      - name: Add rustfmt + clippy
        if: steps.detect.outputs.cargo == 'true'
        run: rustup component add rustfmt clippy

      - name: Check formatting
        if: steps.detect.outputs.cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.detect.outputs.cargo == 'true'
        run: cargo clippy --all-targets -- -D warnings