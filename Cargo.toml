[package]
name = "crap4rust"
version = "0.1.0"
edition = "2021"
description = "Computes the CRAP (Change Risk Anti-Patterns) metric per function for Rust cargo workspaces."

[dependencies]
# `full` = all Rust syntax; `visit` = the read-only AST visitor used by the CC engine.
syn = { version = "2", features = ["full", "visit"] }
# `span-locations` makes proc-macro2 track line/column under the parser fallback,
# so we can capture each function's source line span.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Typed, minimal error for the coverage (LCOV) adapter edge.
thiserror = "2"
# CLI argument parsing (`derive` = the declarative `#[derive(Parser)]` API).
clap = { version = "4", features = ["derive"] }
# Contextual error chaining at the CLI edge (exit-code 1 operational errors).
anyhow = "1"
# `cargo metadata` output is JSON; `derive` lets the workspace adapter name the
# handful of fields it consumes and ignore the rest of the schema.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
